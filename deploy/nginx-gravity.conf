# gravity-integration.com — nginx alternative to public/.htaccess.
# Use this ONLY if the server runs nginx instead of Apache (e.g. a mikr.us VPS);
# it mirrors the .htaccess 1:1. Adjust `root` and the certificate paths.

# http + www → canonical https apex
server {
    listen 80;
    listen [::]:80;
    server_name gravity-integration.com www.gravity-integration.com;
    return 301 https://gravity-integration.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gravity-integration.com;
    # ssl_certificate     /etc/letsencrypt/live/gravity-integration.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gravity-integration.com/privkey.pem;
    return 301 https://gravity-integration.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gravity-integration.com;

    # ssl_certificate     /etc/letsencrypt/live/gravity-integration.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gravity-integration.com/privkey.pem;

    root /var/www/gravity-integration.com;   # <- the uploaded dist/ contents
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # compression
    gzip on;
    gzip_types text/html text/css text/plain text/xml application/javascript
               application/json application/xml application/manifest+json image/svg+xml;

    # legacy WordPress redirects (were WP snippet 6 — MUST survive the rebuild)
    location ~ ^/atomy/?$          { return 301 /technologia/; }
    location ~ ^/atomy-wiedzy/?$   { return 301 /technologia/; }
    location ~ ^/wiecej-niz-etl/?$ { return 301 /technologia/; }
    location ~ ^/feed/?$           { return 301 /; }

    # hashed build assets — immutable
    location /_assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # stable media — a month
    location ~ ^/(media|uploads|theme|video|favicons|fonts)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML / sitemaps / robots — always revalidate
    location ~ \.(html|xml|txt)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
